name: Release on Tag

# Push a tag matching the pubspec version (e.g. version 1.2.0 -> tag v1.2.0)
# to build signed APK/AAB files and publish them as a GitHub release.
#
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.6'
        channel: 'stable'
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Analyze project source
      run: flutter analyze

    - name: Run tests
      run: flutter test

  build_and_release:
    name: Build and Create Release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.6'
        channel: 'stable'
        cache: true

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Get dependencies
      run: flutter pub get

    - name: Check tag matches pubspec version
      id: get_version
      run: |
        VERSION=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
          echo "::error::Invalid version in pubspec.yaml: '$VERSION' (minor/patch must be < 100)"
          exit 1
        fi
        if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
          echo "::error::Tag '$GITHUB_REF_NAME' does not match pubspec version 'v$VERSION'"
          exit 1
        fi
        # versionCode derived from the version (1.3.1 -> 10301) so CI and
        # release builds of the same version agree and new versions always
        # install as an update. Keep in sync with ci_cd.yml.
        IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "build_number=$((MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))" >> "$GITHUB_OUTPUT"

    # Releases must be signed with the same key every time, otherwise users
    # can't install an update over the previous version.
    - name: Configure release signing
      run: |
        if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
          echo "::error::Signing secrets are missing; refusing to publish a debug-signed release"
          exit 1
        fi
        echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
        {
          echo "storeFile=upload-keystore.jks"
          echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
          echo "keyAlias=$ANDROID_KEY_ALIAS"
          echo "keyPassword=$ANDROID_KEY_PASSWORD"
        } > android/key.properties

    - name: Build APK and App Bundle
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
        BUILD_NUMBER: ${{ steps.get_version.outputs.build_number }}
      run: |
        flutter build apk --release --build-number="$BUILD_NUMBER"
        flutter build appbundle --release --build-number="$BUILD_NUMBER"
        cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/trashifier-v$VERSION.apk"
        cp build/app/outputs/bundle/release/app-release.aab "build/app/outputs/bundle/release/trashifier-v$VERSION.aab"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        generate_release_notes: true
        body: |
          ## Downloads
          - **APK**: Direct installation file for Android devices
          - **AAB**: App Bundle for Google Play Store distribution

          ## Installation
          1. Download the APK file
          2. Enable "Install from Unknown Sources" in your Android settings
          3. Install the APK file
        files: |
          build/app/outputs/flutter-apk/trashifier-v${{ steps.get_version.outputs.version }}.apk
          build/app/outputs/bundle/release/trashifier-v${{ steps.get_version.outputs.version }}.aab
