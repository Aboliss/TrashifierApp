name: CI/CD Pipeline

# Tests every push and builds a release APK as a workflow artifact.
# Publishing a GitHub release is handled by release.yml (tag push).

on:
  push:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.6'
        channel: 'stable'
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Verify formatting
      run: dart format --output=none --set-exit-if-changed .

    - name: Analyze project source
      run: flutter analyze

    - name: Run tests
      run: flutter test

  build_apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: test
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.6'
        channel: 'stable'
        cache: true

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Get dependencies
      run: flutter pub get

    - name: Get version from pubspec.yaml
      id: get_version
      run: |
        VERSION=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
          echo "::error::Invalid version in pubspec.yaml: '$VERSION' (minor/patch must be < 100)"
          exit 1
        fi
        # versionCode derived from the version (1.3.1 -> 10301) so CI and
        # release builds of the same version agree and new versions always
        # install as an update. Keep in sync with release.yml.
        IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "build_number=$((MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))" >> "$GITHUB_OUTPUT"

    # Optional here: without secrets the APK is signed with a throwaway debug
    # key, which is fine for a CI artifact but cannot update a real install.
    - name: Configure release signing
      if: env.ANDROID_KEYSTORE_BASE64 != ''
      run: |
        echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
        {
          echo "storeFile=upload-keystore.jks"
          echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
          echo "keyAlias=$ANDROID_KEY_ALIAS"
          echo "keyPassword=$ANDROID_KEY_PASSWORD"
        } > android/key.properties

    - name: Build APK
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
        BUILD_NUMBER: ${{ steps.get_version.outputs.build_number }}
      run: |
        flutter build apk --release --build-number="$BUILD_NUMBER"
        cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/trashifier-v$VERSION.apk"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: trashifier-v${{ steps.get_version.outputs.version }}-apk
        path: build/app/outputs/flutter-apk/trashifier-v${{ steps.get_version.outputs.version }}.apk
