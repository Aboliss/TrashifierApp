name: trashifier_app
description: "Trash pickup calendar with reminders and a home screen widget."
version: 1.6.1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.2
  table_calendar: ^3.2.0
  flutter_local_notifications: ^19.1.0
  timezone: ^0.10.1
  provider: ^6.1.2
  package_info_plus: ^8.0.2
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  # assets/icons/ only feeds the launcher icon and native splash generators;
  # the app draws Bin Buddy itself.
  assets:
    - assets/fonts/OFL-BricolageGrotesque.txt
    - assets/fonts/OFL-Figtree.txt

  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700

flutter_native_splash:
  # Bin Buddy alone (no circle) on the theme's background.
  image: assets/icons/splash_light.png
  color: "F4F5EF"
  image_dark: assets/icons/splash_dark.png
  color_dark: "0F1512"

  android_12:
    image: assets/icons/splash_light.png
    color: "F4F5EF"
    image_dark: assets/icons/splash_dark.png
    color_dark: "0F1512"

  android: true
  ios: false
  web: false